openapi: 3.0.1
info:
  title: Product API
  description: PactFlow Product API demo
  version: 1.1.0
paths:
  /products:
    post:
      summary: Create a product
      description: Creates a new product
      operationId: createProduct
      requestBody:
        description: Create a new Product
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
            examples:
              application/json:
                value:
                  id: "1234"
                  type: "food"
                  price: 42
      responses:
        "200":
          description: successful operation
          content:
            "application/json; charset=utf-8":
              schema:
                $ref: '#/components/schemas/Product'
    get:
      summary: List all products
      description: Returns all products
      operationId: getAllProducts
      responses:
        "200":
          description: successful operation
          content:
            "application/json; charset=utf-8":
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
        "400":
          description: Invalid ID supplied
          content: {}
  /product/{id}:
    get:
      summary: Find product by ID
      description: Returns a single product
      operationId: getProductByID
      parameters:
        - name: id
          in: path
          description: ID of product to get
          schema:
            type: string
          required: true
          example: "10"
      responses:
        "200":
          description: successful operation
          content:
            "application/json; charset=utf-8":
              schema:
                $ref: '#/components/schemas/Product'
        "400":
          description: Invalid ID supplied
          content: {}
        "404":
          description: Product not found
          content: {}
        "500":
          description: Internal server error
          content: {}
  /products/search:
    get:
      summary: Search products
      description: Search for products by various criteria
      operationId: searchProducts
      parameters:
        - name: type
          in: query
          description: Product type to search for
          schema:
            type: string
          required: false
          example: "CREDIT_CARD"
      responses:
        "200":
          description: successful operation
          content:
            "application/json; charset=utf-8":
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
        "400":
          description: Invalid search parameters
          content: {}
  /products/filter:
    get:
      summary: Filter products by price range
      description: Returns products within the specified price range
      operationId: filterProducts
      parameters:
        - name: minPrice
          in: query
          description: Minimum price
          schema:
            type: string
          required: false
          example: "20"
        - name: maxPrice
          in: query
          description: Maximum price
          schema:
            type: string
          required: false
          example: "50"
      responses:
        "200":
          description: successful operation
          content:
            "application/json; charset=utf-8":
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
        "400":
          description: Invalid filter parameters
          content: {}
  /products/type/{type}:
    get:
      summary: Get products by type
      description: Returns all products of a specific type
      operationId: getProductsByType
      parameters:
        - name: type
          in: path
          description: Product type
          schema:
            type: string
          required: true
          example: "SAVINGS"
      responses:
        "200":
          description: successful operation
          content:
            "application/json; charset=utf-8":
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
        "404":
          description: Product type not found
          content: {}
components:
  schemas:
    Product:
      type: object
      required:
        - id
        - type
        - price
      properties:
        id:
          type: string
          description: Unique product identifier
        type:
          type: string
          description: Product type
        name:
          type: string
          description: Product name (optional)
        version:
          type: string
          description: Product version (optional)
        price:
          type: number
          description: Product price
